name: Check production

# 운영 서버 점검(scripts/check-production.mjs). Claude 작업 환경은 teamkick.co.kr 에 직접 못 붙어서 여기서 확인한다.
# 저장소가 공개라 이 기록도 공개 — 스크립트는 버전·상태 코드·예약 실행 숫자만 출력한다.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "예약 실행(10분마다)을 기다릴 시간(분). 0 이면 사이트만 본다"
        required: false
        default: "11"
      tables:
        description: "있어야 하는 표 이름(쉼표로). 비우면 목록만 출력"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MINUTES: ${{ github.event.inputs.minutes }}
      TABLES: ${{ github.event.inputs.tables }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node scripts/check-production.mjs
