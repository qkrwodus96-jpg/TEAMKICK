name: Deploy to Cloudflare

# main 에 합쳐지면 테스트 → 빌드 → 운영자 Cloudflare 계정에 배포(scripts/cloudflare-deploy.mjs).
# 필요한 값(GitHub → Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (packageManager)
        run: corepack enable && pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: node --test tests/core.test.mjs
      - name: Build
        run: pnpm build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/cloudflare-deploy.mjs
