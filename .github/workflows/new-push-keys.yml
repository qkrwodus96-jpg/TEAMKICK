name: New push keys

# 휴대폰 알림 키(VAPID)를 새로 만들어 Cloudflare teamkick 에 바로 넣는다(scripts/rotate-vapid.mjs).
# 값은 로그에 나오지 않는다. 누를 때마다 키가 바뀌니 필요할 때 한 번만 누른다.
# 실행: GitHub → Actions → New push keys → Run workflow → 확인 칸에 NEW 입력
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "새 키로 바꾸려면 NEW 라고 적으세요"
        required: true

permissions:
  contents: read

jobs:
  rotate:
    if: github.event.inputs.confirm == 'NEW'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node scripts/rotate-vapid.mjs
